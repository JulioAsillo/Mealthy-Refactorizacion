services:
  db:
    image: postgres:17
    container_name: mealthy-db
    environment:
      POSTGRES_DB: mealthy
      POSTGRES_USER: mealthy
      POSTGRES_PASSWORD: mealthy_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealthy -d mealthy"]
      interval: 5s
      retries: 5
    
volumes:
  pgdata:
        
    